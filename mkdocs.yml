site_name: Brewlet agents
site_description: Microsoft Copilot SDK agents in Java, Node.js, Python and .NET, with a Wikipedia summarizer and an observability stack, deployed to a local Brewlet-enabled Kubernetes cluster with kind.
site_url: https://brunoborges.github.io/brewlet-agents/
repo_url: https://github.com/brunoborges/brewlet-agents
repo_name: brunoborges/brewlet-agents
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

hooks:
  - docs/hooks.py

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: quickstart.md
      - GitHub authentication: authentication.md
  - Concepts:
      - Design: design.md
      - Architecture: architecture.md
      - The Runtime Concierge contract: contract.md
  - Agents:
      - Overview: agents/index.md
      - Java:
          - Spring Boot: agents/java-spring.md
          - Quarkus: agents/java-quarkus.md
          - Micronaut: agents/java-micronaut.md
      - Node.js:
          - NestJS: agents/node-nestjs.md
          - Fastify: agents/node-fastify.md
      - Python:
          - FastAPI: agents/python-fastapi.md
          - Django: agents/python-django.md
      - .NET:
          - ASP.NET Core: agents/dotnet-aspnet.md
  - Wikipedia example:
      - Overview: apps/index.md
      - Wikipedia summarizer: apps/wikipedia-summarizer.md
      - Wikipedia front-end: apps/wikipedia-frontend.md
      - jlib-inspector server: apps/jlib-server.md
      - jlib-inspector dashboard: apps/jlib-ui.md
  - Demos:
      - Runtime rotation: rotation.md
  - DevRel kit:
      - Overview: devrel/index.md
      - Demo script, 10 minutes: devrel/demo-script.md
      - Workshop, 90 minutes: devrel/workshop.md
      - Blog and video ideas: devrel/content-ideas.md
  - Operations:
      - Observability and dashboards: observability.md
      - Security model: security.md
      - Troubleshooting: troubleshooting.md
      - Reference: reference.md
