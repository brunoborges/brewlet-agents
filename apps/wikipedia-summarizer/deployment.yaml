# wikipedia-summarizer on Kubernetes: the complete deployment, readable top to bottom.
#
# `make deploy AGENT=wikipedia-summarizer` applies this file as written, except that it replaces
# the two `image:` lines with the digests that `make publish` and `make sidecar` pushed
# (scripts/agent-pin.sh). Brewlet runs only digest-pinned application images, which is why the
# file names the tags.
#
# One Pod, two containers, two owners:
#   app          the application artifact: code + dependencies + launch.json, nothing else.
#                Brewlet supplies the language runtime chosen by the annotation below: java-25-jlib,
#                the Ops-owned java-25 runtime that also carries the jlib-inspector agent.
#   copilot-cli  an ordinary OCI sidecar that runs the Copilot CLI. It is the only container that
#                holds GitHub credentials; the app reaches it over the Pod's loopback interface.
#
# Telemetry comes from the runtime, not from this application: the jlib-inspector agent is attached
# by the runtime image, and it reads where to report from the environment below. It sends the
# libraries the JVM loaded to jlib-server and to the OpenTelemetry dashboard, both in the
# observability namespace (make observability).
#
# Not in this file: the namespace and the Secret `copilot-cli`. `make deploy` creates the namespace
# with Pod Security "restricted" and the Secret with a random connection token; `make auth` adds
# the optional GitHub token to that Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wikipedia-summarizer
  namespace: agents
# The app never calls the Kubernetes API, so it gets no API token.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wikipedia-summarizer
  namespace: agents
  labels:
    app.kubernetes.io/name: wikipedia-summarizer
    app.kubernetes.io/part-of: brewlet-agents
  annotations:
    # Ask the Brewlet operator to roll this Deployment when Ops rotates the runtime image.
    brewlet.sh/restart-on-rotation: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wikipedia-summarizer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wikipedia-summarizer
        app.kubernetes.io/part-of: brewlet-agents
        brewlet-agents.dev/language: java
      annotations:
        # The suffix is the container name: this container runs on the platform-owned runtime.
        runtime-image.brewlet.sh/app: java-25-jlib
    spec:
      runtimeClassName: brewlet
      serviceAccountName: wikipedia-summarizer
      automountServiceAccountToken: false
      # A Service called "copilot" would otherwise inject COPILOT_PORT=tcp://..., which the CLI
      # reads as its own setting.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 20
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # A native sidecar: starts before the app and lives as long as the Pod.
        - name: copilot-cli
          image: localhost:5001/copilot-cli:1.0.114
          restartPolicy: Always
          env:
            # The SDK must present this token; the CLI refuses connections without it.
            - name: COPILOT_CONNECTION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: copilot-cli
                  key: connection-token
            # Optional: absent until 'make auth', in which case the CLI starts unauthenticated.
            - name: COPILOT_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: copilot-cli
                  key: github-token
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cli-tmp
              mountPath: /tmp
      containers:
        - name: app
          image: localhost:5001/apps/wikipedia-summarizer:dev
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            # Where the sidecar listens: the Pod's loopback interface.
            - name: COPILOT_CLI_URL
              value: 127.0.0.1:4321
            # The connection token is a file, not an environment variable: the jlib-inspector agent
            # of the java-25-jlib runtime sends the whole process environment to jlib-server, which
            # shows it to anyone who opens the dashboard. Spring turns each file in this directory
            # into a property named after the file (application.yml reads `connection-token`).
            - name: SPRING_CONFIG_IMPORT
              value: configtree:/app/secrets/
            # The Downward API: these identify the Pod in the telemetry below.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Read by the jlib-inspector agent that the java-25-jlib runtime attaches.
            - name: JLIB_SERVER_URL
              value: http://jlib-server.observability.svc:8080
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://aspire-dashboard.observability.svc:18890
            - name: OTEL_SERVICE_NAME
              value: wikipedia-summarizer
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=agents,k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.node.name=$(NODE_NAME)
            # The agent logs through the application's logging and lists the JVM's flags at every
            # report interval. WARN keeps that listing out of the log but still shows an export
            # failure. The runtime does not open jdk.management/com.sun.management.internal to the
            # agent (that would open a JDK-internal package to every application on the runtime), so
            # the agent reports the flags it can read without it and logs an error about the rest:
            # that package is silenced.
            - name: LOGGING_LEVEL_IO_GITHUB_BRUNOBORGES_JLIB_AGENT
              value: WARN
            - name: LOGGING_LEVEL_IO_GITHUB_BRUNOBORGES_JLIB_AGENT_JVM
              value: "OFF"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            # Brewlet's admission fills in the runtime's approved uid/gid; this keeps the manifest
            # compliant with Pod Security "restricted" before that happens.
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app-tmp
              mountPath: /tmp
            # Beneath /app, so the runtime needs no approved mount path for it.
            - name: copilot-connection
              mountPath: /app/secrets
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: app-tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: cli-tmp
          emptyDir:
            sizeLimit: 128Mi
        # One key of the Secret, not the Secret: its GitHub token belongs to the sidecar alone.
        - name: copilot-connection
          secret:
            secretName: copilot-cli
            items:
              - key: connection-token
                path: connection-token
---
apiVersion: v1
kind: Service
metadata:
  name: wikipedia-summarizer
  namespace: agents
  labels:
    app.kubernetes.io/name: wikipedia-summarizer
    app.kubernetes.io/part-of: brewlet-agents
spec:
  selector:
    app.kubernetes.io/name: wikipedia-summarizer
  ports:
    - name: http
      port: 80
      targetPort: http
