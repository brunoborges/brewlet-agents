# jlib-server on Kubernetes: the complete deployment, readable top to bottom.
#
# `make deploy APP=jlib-server` applies this file as written, except that it replaces the `image:`
# line with the digest that `make publish` pushed (scripts/agent-pin.sh). Brewlet runs only
# digest-pinned application images, which is why the file names the tag.
#
# One container: the application artifact (the server's jar + launch.json, nothing else). Brewlet
# supplies Java 25 from the platform-owned runtime named by the annotation below. This is the plain
# java-25 runtime, not java-25-jlib: the inspector's own server is not inspected.
#
# The server keeps what the applications report in memory, so a restart empties it until the next
# report, at most 30 seconds later. It has no authentication, which is why the Service is only
# reachable inside the cluster.
#
# Not in this file: the namespace (`make deploy` creates it with Pod Security "restricted").
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jlib-server
  namespace: observability
# The app never calls the Kubernetes API, so it gets no API token.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jlib-server
  namespace: observability
  labels:
    app.kubernetes.io/name: jlib-server
    app.kubernetes.io/part-of: brewlet-agents
  annotations:
    # Ask the Brewlet operator to roll this Deployment when Ops rotates the runtime image.
    brewlet.sh/restart-on-rotation: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jlib-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jlib-server
        app.kubernetes.io/part-of: brewlet-agents
        brewlet-agents.dev/language: java
      annotations:
        # The suffix is the container name: this container runs on the platform-owned runtime.
        runtime-image.brewlet.sh/app: java-25
    spec:
      runtimeClassName: brewlet
      serviceAccountName: jlib-server
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 20
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: localhost:5001/apps/jlib-server:dev
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            # Brewlet's admission fills in the runtime's approved uid/gid; this keeps the manifest
            # compliant with Pod Security "restricted" before that happens.
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app-tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: app-tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jlib-server
  namespace: observability
  labels:
    app.kubernetes.io/name: jlib-server
    app.kubernetes.io/part-of: brewlet-agents
spec:
  selector:
    app.kubernetes.io/name: jlib-server
  ports:
    - name: http
      port: 8080
      targetPort: http
