name: End to end

# Brings the whole platform up on a GitHub-hosted runner (kind, a local registry, Brewlet, the
# Ops-owned runtimes and the Copilot CLI sidecar), then deploys agents and smoke-tests them. It is
# much slower than CI, so it runs on demand and once a week instead of on every push.
on:
  workflow_dispatch:
    inputs:
      agents:
        description: Agents to deploy, separated by spaces (make list shows them all)
        type: string
        default: java-spring node-fastify python-fastapi dotnet-aspnet
      apps:
        description: Also deploy the observability stack, the Wikipedia summarizer and its front-end, and check the dashboards
        type: boolean
        default: true
      rotation:
        description: Also run the runtime rotation demo (make rotate); needs a Java agent in the list
        type: boolean
        default: false
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    name: Platform, agents and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AGENTS: ${{ inputs.agents || 'java-spring node-fastify python-fastapi dotnet-aspnet' }}
      # The scheduled run has no inputs, so it always includes the apps.
      RUN_APPS: ${{ github.event_name == 'schedule' || inputs.apps }}
      # A boolean only: the token itself is handed to the one step that needs it.
      HAS_COPILOT_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check the host
        run: make doctor
      - name: Bring up the platform (kind, registry, Brewlet, runtimes, Copilot CLI sidecar)
        run: make up

      - name: Build, publish, deploy and smoke-test the agents
        run: |
          for agent in $AGENTS; do
            echo "::group::$agent"
            make agent AGENT="$agent"
            echo "::endgroup::"
          done

      - name: Deploy the telemetry stack, the Wikipedia summarizer and its front-end
        if: env.RUN_APPS == 'true'
        run: |
          make observability
          make wikipedia

      - name: Give the Copilot CLI sidecar a GitHub token and run the live checks
        if: env.HAS_COPILOT_TOKEN == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          make auth
          for agent in $AGENTS; do
            echo "::group::$agent"
            REQUIRE_AUTH=1 make smoke AGENT="$agent"
            echo "::endgroup::"
          done
          if [ "$RUN_APPS" = true ]; then
            echo "::group::wikipedia-summarizer"
            REQUIRE_AUTH=1 make smoke APP=wikipedia-summarizer
            make summarize URL=https://en.wikipedia.org/wiki/Kubernetes VIA=frontend
            echo "::endgroup::"
          fi
      - name: Explain why the live checks were skipped
        if: env.HAS_COPILOT_TOKEN != 'true'
        run: echo "::notice::The secret COPILOT_GITHUB_TOKEN is not set, so only the checks that need no model ran."

      - name: Check that telemetry reached both back ends and that every dashboard answers
        if: env.RUN_APPS == 'true'
        run: |
          make telemetry
          scripts/observability/dashboards.sh --check

      - name: Rotate the java-25 runtime and watch the Java agents follow
        if: inputs.rotation
        run: make rotate

      - name: Diagnostics
        if: always()
        run: |
          make status || true
          export KUBECONFIG="$PWD/build/kubeconfig"
          kubectl -n agents get events --sort-by=.lastTimestamp | tail -n 40 || true
          for agent in $AGENTS; do
            echo "::group::logs of $agent"
            make logs AGENT="$agent" || true
            echo "::endgroup::"
          done
          if [ "$RUN_APPS" = true ]; then
            kubectl -n observability get events --sort-by=.lastTimestamp | tail -n 40 || true
            for app in wikipedia-summarizer wikipedia-frontend; do
              echo "::group::logs of $app"
              make logs APP="$app" || true
              echo "::endgroup::"
            done
            # Not the dashboard's own log: it prints the address that signs in to the dashboard.
            for deployment in jlib-server jlib-ui; do
              echo "::group::logs of $deployment"
              kubectl -n observability logs "deployment/$deployment" --tail=60 || true
              echo "::endgroup::"
            done
          fi
