quarkus.banner.enabled=false

# The Pod sets PORT; bind every interface so the kubelet probes and the Service can reach the app.
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0
# Graceful shutdown: let in-flight requests finish within the Pod's 20 s termination grace period.
quarkus.shutdown.timeout=15s

# The Copilot CLI runs in the sidecar container of the same Pod. Both values come from the
# Pod spec; there are deliberately no defaults, so a misconfigured Pod fails at startup.
quarkus.copilot.cli-url=${COPILOT_CLI_URL}
quarkus.copilot.tcp-connection-token=${COPILOT_CONNECTION_TOKEN}
quarkus.copilot.sessions.cleanup.max-age=1h

# Allow-list over every tool source: the model may call only the tools registered on the session, i.e. runtime_facts.
# built-in-tools=false would not be enough: it only excludes builtin:*, so the CLI's GitHub MCP tools and web_search
# stay callable. available-tools cannot be combined with built-in-tools=false or excluded-tools.
quarkus.copilot.agents.concierge.available-tools=custom:*
quarkus.copilot.agents.concierge.response-timeout=2m
quarkus.copilot.agents.concierge.permissions.allow-agent-tools=true

# What the Pod spec (deployment.yaml) tells the process about its deployment; see ConciergeConfig.
concierge.agent-name=${AGENT_NAME:java-quarkus}
concierge.runtime-id=${AGENT_RUNTIME_ID:unknown}
concierge.pod=${POD_NAME:${HOSTNAME:unknown}}
concierge.namespace=${POD_NAMESPACE:unknown}
concierge.node=${NODE_NAME:unknown}
