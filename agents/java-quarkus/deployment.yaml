# java-quarkus on Kubernetes: the complete deployment, readable top to bottom.
#
# `make deploy AGENT=java-quarkus` applies this file as written, except that it replaces the agent's
# `image:` line with the digest that `make publish` pushed (scripts/workloads/pin.sh). Brewlet runs
# only digest-pinned application images, which is why the file names the tag.
#
# One Pod, two containers, two owners:
#   agent        the application artifact: code + dependencies + launch.json, nothing else.
#                Brewlet supplies the language runtime (java-25) chosen by the annotation below.
#   copilot-cli  an ordinary OCI sidecar that runs the Copilot CLI. It is the only container that
#                holds GitHub credentials; the agent reaches it over the Pod's loopback interface.
#
# Not in this file: the namespace and the Secret `copilot-cli`. `make deploy` creates the namespace
# with Pod Security "restricted" and the Secret with a random connection token; `make auth` adds
# the optional GitHub token to that Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: java-quarkus
  namespace: agents
# The agent never calls the Kubernetes API, so it gets no API token.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-quarkus
  namespace: agents
  labels:
    app.kubernetes.io/name: java-quarkus
    app.kubernetes.io/part-of: brewlet-agents
  annotations:
    # Ask the Brewlet operator to roll this Deployment when Ops rotates the runtime image.
    brewlet.sh/restart-on-rotation: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: java-quarkus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: java-quarkus
        app.kubernetes.io/part-of: brewlet-agents
        brewlet-agents.dev/language: java
      annotations:
        # The suffix is the container name: this container runs on the platform-owned runtime.
        runtime-image.brewlet.sh/agent: java-25
    spec:
      runtimeClassName: brewlet
      serviceAccountName: java-quarkus
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # A native sidecar: starts before the agent and lives as long as the Pod.
        - name: copilot-cli
          # GitHub's image of the CLI release, pinned by digest (COPILOT_CLI_IMAGE in versions.env).
          image: ghcr.io/github/copilot-cli:1.0.114@sha256:5083f9892836b4d1cc975386b0fbe9ded2658f22ae43f81c0a36fe917f85b1a9
          restartPolicy: Always
          # Appended to the image's server command, which listens on every interface. That would
          # include the Pod IP; this keeps the CLI on the loopback interface the agent shares.
          args: ["--host", "127.0.0.1"]
          env:
            # The SDK must present this token; the CLI refuses connections without it.
            - name: COPILOT_CONNECTION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: copilot-cli
                  key: connection-token
            # Optional: absent until 'make auth', in which case the CLI starts unauthenticated.
            - name: COPILOT_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: copilot-cli
                  key: github-token
                  optional: true
            # The root filesystem is read-only: the CLI unpacks itself and keeps its state in /tmp.
            - name: HOME
              value: /tmp
          # About 150 MiB before the first request, and it grows with concurrent conversations.
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cli-tmp
              mountPath: /tmp
      containers:
        - name: agent
          image: localhost:5001/agents/java-quarkus:dev
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: AGENT_NAME
              value: java-quarkus
            - name: AGENT_RUNTIME_ID
              value: java-25
            # Where the sidecar listens: the Pod's loopback interface.
            - name: COPILOT_CLI_URL
              value: 127.0.0.1:4321
            - name: COPILOT_CONNECTION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: copilot-cli
                  key: connection-token
            # The Downward API: the agent reports these in GET /runtime.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # Measured numbers are in README.md.
          resources:
            requests:
              cpu: 100m
              memory: 160Mi
            limits:
              memory: 320Mi
          securityContext:
            # Brewlet's admission fills in the runtime's approved uid/gid; this keeps the manifest
            # compliant with Pod Security "restricted" before that happens.
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: agent-tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: agent-tmp
          emptyDir:
            sizeLimit: 64Mi
        # The CLI unpacks about 275 MB of itself here on every start.
        - name: cli-tmp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: java-quarkus
  namespace: agents
  labels:
    app.kubernetes.io/name: java-quarkus
    app.kubernetes.io/part-of: brewlet-agents
spec:
  selector:
    app.kubernetes.io/name: java-quarkus
  ports:
    - name: http
      port: 80
      targetPort: http
