# java.util.logging configuration of the jlib-inspector server (see launch.json).
handlers = java.util.logging.ConsoleHandler
.level = INFO
java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format = %1$tFT%1$tT.%1$tL %4$s %3$s: %5$s%6$s%n

# The server logs every report, and every jar in it, at INFO, and every instrumented JVM sends a
# report every 30 seconds. At WARNING the log keeps the server's errors; its start-up line stays.
io.github.brunoborges.jlib.server.level = WARNING
io.github.brunoborges.jlib.server.JLibServer.level = INFO
